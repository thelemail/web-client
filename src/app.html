<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		%sveltekit.head%
		<script>
			(function () {
				var v;
				try {
					v = localStorage.getItem('thelemail.theme');
				} catch (e) {}
				if (v !== 'dark' && v !== 'auto' && v !== 'light') v = 'light';
				var dark =
					v === 'dark' ||
					(v === 'auto' &&
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme-pref', v);
			})();
		</script>
		<style>
			html {
				background: #fdfcf9;
			}
			html[data-theme='dark'] {
				background: #11150f;
			}
			#boot {
				display: none;
			}
			@supports selector(html:has(*)) {
				#boot {
					position: fixed;
					inset: 0;
					display: flex;
					align-items: center;
					justify-content: center;
				}
				body:has(#svroot > :not(script)) #boot {
					display: none;
				}
			}
			#boot span {
				width: 30px;
				height: 30px;
				border: 2px solid #dbe8df;
				border-top-color: #204030;
				border-radius: 50%;
				animation: bootspin 900ms linear infinite;
			}
			html[data-theme='dark'] #boot span {
				border-color: #313b2f;
				border-top-color: #8db59f;
			}
			@keyframes bootspin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot span {
					animation-duration: 2.4s;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svroot" style="display: contents">%sveltekit.body%</div>
		<div id="boot" role="status" aria-label="Loading Thelemail"><span></span></div>
	</body>
</html>
