name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      TRUST_READ_TOKEN:
        required: true
      FONTAWESOME_NPM_AUTH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the build configuration
        run: cat .github/build-config.env >> "$GITHUB_ENV"

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack install

      - name: Load the trust roots
        run: |
          set -euo pipefail
          {
            echo 'PUBLIC_DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED<<TRUSTROOT_EOF'
            cat trust-roots/directory-signing-key.asc
            echo 'TRUSTROOT_EOF'
            echo 'PUBLIC_TLOG_POLICY<<TRUSTROOT_EOF'
            cat trust-roots/tlog-policy.json
            echo 'TRUSTROOT_EOF'
            echo 'PUBLIC_OFFICIAL_SENDER_POLICY<<TRUSTROOT_EOF'
            cat trust-roots/official-sender.json
            echo 'TRUSTROOT_EOF'
          } >> "$GITHUB_ENV"

      - name: Authenticate to the Font Awesome registry
        run: echo '//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}' >> ~/.npmrc

      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the trust roots
        run: node scripts/check-trust-roots.mjs

      - name: Check the trust vectors against the pinned release
        env:
          TRUST_READ_TOKEN: ${{ secrets.TRUST_READ_TOKEN }}
        run: node scripts/trust-vectors.mjs --check

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Restore the pinned search model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/thelemail/models
          key: search-model-${{ hashFiles('scripts/model-manifest.json') }}

      - name: Build
        run: pnpm --filter @thelemail/mail --filter @thelemail/calendar build

      - name: Check that the bundle contacts no third party
        run: pnpm --filter @thelemail/mail --filter @thelemail/calendar verify:bundle

      - name: Check the initial bundle size of the mail app
        run: pnpm --filter @thelemail/mail verify:size

      - name: Build the auth app
        run: |
          set -euo pipefail
          set -a
          . .github/auth-build-config.env
          set +a
          PUBLIC_THELEMAIL_PRODUCT=auth pnpm --filter @thelemail/auth build
          PUBLIC_THELEMAIL_PRODUCT=auth pnpm --filter @thelemail/auth verify:bundle

      - name: Build the parser app
        run: |
          set -euo pipefail
          pnpm --filter @thelemail/parser build
          pnpm --filter @thelemail/parser verify:bundle

      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Validate the auth Caddyfile
        run: |
          docker run --rm -v "$PWD/caddy/auth.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/apps/auth/build-meta/csp.caddy:/etc/caddy/csp.caddy:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Check the static host
        run: |
          set -euo pipefail
          for app in mail calendar; do
            docker run -d --rm --name "static-$app" -p 8080:80 \
              -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$PWD/apps/$app/build:/srv:ro" \
              caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
            timeout 30 sh -c 'until curl -so /dev/null http://localhost:8080/robots.txt; do sleep 0.5; done'
            node scripts/check-static-host.mjs http://localhost:8080 "apps/$app/build"
            docker stop "static-$app"
          done

      - name: Check the auth host headers
        run: |
          set -euo pipefail
          docker run -d --rm --name static-auth -p 8081:80 \
            -v "$PWD/caddy/auth.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/apps/auth/build-meta/csp.caddy:/etc/caddy/csp.caddy:ro" \
            -v "$PWD/apps/auth/build:/srv:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          timeout 30 sh -c 'until curl -so /dev/null http://localhost:8081/robots.txt; do sleep 0.5; done'
          node scripts/check-auth-host.mjs http://localhost:8081 apps/auth/build
          docker stop static-auth

      - name: Check the parser host headers
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/caddy/parser.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/apps/parser/build-meta/csp.caddy:/etc/caddy/csp.caddy:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          docker run -d --rm --name static-parser -p 8082:80 \
            -v "$PWD/caddy/parser.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/apps/parser/build-meta/csp.caddy:/etc/caddy/csp.caddy:ro" \
            -v "$PWD/apps/parser/build:/srv:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          timeout 30 sh -c 'until curl -so /dev/null http://localhost:8082/robots.txt; do sleep 0.5; done'
          app="$(printf '%s' "$PUBLIC_PRODUCT_ORIGINS" | tr ',' '\n' | sed -n 's/^app=//p')"
          node scripts/check-parser-host.mjs http://localhost:8082 apps/parser/build "$app"
          docker stop static-parser
