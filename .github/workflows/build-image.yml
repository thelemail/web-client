name: build-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the build configuration
        run: cat .github/build-config.env >> "$GITHUB_ENV"

      - id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Encode the build-time public material
        env:
          DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED: ${{ vars.PUBLIC_DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED }}
          TLOG_POLICY: ${{ vars.PUBLIC_TLOG_POLICY }}
        run: |
          set -euo pipefail
          {
            printf 'PUBLIC_DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED_B64=%s\n' \
              "$(printf '%s' "$DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED" | base64 -w0)"
            printf 'PUBLIC_TLOG_POLICY_B64=%s\n' \
              "$(printf '%s' "$TLOG_POLICY" | base64 -w0)"
          } >> "$GITHUB_ENV"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}
            PUBLIC_SUBMISSION_BASE_URL=${{ env.PUBLIC_SUBMISSION_BASE_URL }}
            CSP_BLOB_ORIGIN=${{ env.CSP_BLOB_ORIGIN }}
            PUBLIC_DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED_B64=${{ env.PUBLIC_DIRECTORY_SIGNING_PUBLIC_KEY_ARMORED_B64 }}
            PUBLIC_TLOG_POLICY_B64=${{ env.PUBLIC_TLOG_POLICY_B64 }}
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref }}
            BUILD_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Record the mapping
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf 'commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'image: `%s/%s@%s`\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      - name: Verify the tag is signed by the release key
        env:
          TAG: ${{ github.ref_name }}
          FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$FINGERPRINT" ]; then
            echo "Set the RELEASE_SIGNING_FINGERPRINT repository variable to the release key fingerprint." >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          gpg --import .github/release-signing-key.asc
          git verify-tag --raw "refs/tags/${TAG}" 2>&1 | grep -q "VALIDSIG ${FINGERPRINT}"

      - name: Assemble the release artifacts
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.build.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          git -c tar.tar.gz.command='gzip -cn' archive \
            --format=tar.gz \
            --prefix="web-client-${version}/" \
            -o "dist/web-client-${version}-source.tar.gz" \
            "refs/tags/${TAG}"
          jq -n --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
                --arg image "$IMAGE" --arg digest "$IMAGE_DIGEST" \
                '{tag: $tag, commit: $commit, image: $image, digest: $digest}' \
            > dist/release-metadata.json
          cd dist
          sha256sum "web-client-${version}-source.tar.gz" sbom.spdx.json release-metadata.json > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/web-client-*-source.tar.gz
            dist/sbom.spdx.json
            dist/release-metadata.json
            dist/SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.build.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            printf 'Container image: `%s@%s`\n\n' "$IMAGE" "$IMAGE_DIGEST"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Verify with `cosign verify` and `gh attestation verify`; see the README.\n'
          } > dist/notes.md
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file dist/notes.md \
            "dist/web-client-${version}-source.tar.gz" \
            dist/sbom.spdx.json \
            dist/release-metadata.json \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json
